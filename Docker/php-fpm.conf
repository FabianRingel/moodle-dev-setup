; ==============================================================================
; PHP-FPM-Pool für Moodle
; ==============================================================================
; Wird als zz-moodle.conf nach der zz-docker.conf des Basis-Images geladen
; (diese setzt bereits "listen = 9000").

[www]
; Umgebungsvariablen (MOODLE_*) an PHP durchreichen – Docker/config.php liest
; sie per getenv(). Ohne diese Einstellung leert PHP-FPM die Umgebung.
clear_env = no

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6

; Passend zu fastcgi_read_timeout in Docker/nginx.conf
request_terminate_timeout = 300

; PHP-Fehler landen im Container-Log (docker compose logs moodle)
catch_workers_output = yes
decorate_workers_output = no
