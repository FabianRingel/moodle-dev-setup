; PHP-FPM-Pool-Einstellungen für Moodle (ergänzt die Standard-Pool-Konfiguration)

[www]
; Umgebungsvariablen an PHP weiterreichen – Docker/config.php liest
; die Moodle-Einstellungen per getenv()
clear_env = no

; Langlaufende Requests (Backups, Upgrades) nicht vorzeitig abbrechen
request_terminate_timeout = 300s
