# ==============================================================================
# nginx-Konfiguration für Moodle (PHP-FPM im Container "moodle", 127.0.0.1:9000)
# ==============================================================================
# __DOCROOT__ und __FALLBACK__ werden beim Image-Build gesetzt (siehe Dockerfile):
#   __DOCROOT__   /var/www/html/public (ab Moodle 5.1) bzw. /var/www/html
#   __FALLBACK__  /r.php (Moodle-Router, ab 5.1) bzw. =404

server {
    listen 80 default_server;
    server_name _;

    root __DOCROOT__;
    index index.php index.html;

    # Uploads bis zur Grenze aus Docker/php.ini (post_max_size)
    client_max_body_size 1G;

    # Interne Dateien nie ausliefern (siehe Moodle-Doku "Nginx")
    location ~ (/vendor/|/node_modules/|composer\.(json|lock)$|/readme|/README|readme\.txt|/upgrade\.txt|/UPGRADING\.md|/db/install\.xml|/fixtures/|/behat/|phpunit\.xml|\.lock$|environment\.xml) {
        deny all;
        return 404;
    }

    # Versteckte Dateien (.git, .htaccess, …) sperren
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    location / {
        try_files $uri $uri/ __FALLBACK__;
    }

    # PHP inkl. Slash-Argumente (z.B. /pluginfile.php/1/…)
    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        # try_files setzt $fastcgi_path_info zurück, daher vorher sichern
        set $path_info $fastcgi_path_info;

        # Nicht existierende *.php gehen an den Router (Moodle-Shim-Routen)
        try_files $fastcgi_script_name __FALLBACK__;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO       $path_info;
        fastcgi_index index.php;
        # PHP-FPM im moodle-Container (gemeinsamer Netzwerk-Namespace)
        fastcgi_pass  127.0.0.1:9000;

        # Lange Admin-Vorgänge (Upgrade, Backup, …) nicht abbrechen
        fastcgi_read_timeout 300s;
        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 64k;
    }
}
