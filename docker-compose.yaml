# ==============================================================================
# Moodle Development Stack - Docker Compose Configuration
# ==============================================================================
#
# Dieser Docker Compose Stack stellt eine vollständige Moodle-Entwicklungsumgebung bereit
# mit allen erforderlichen Services für die lokale Entwicklung.
#
# Services:
# - web: nginx-Webserver, leitet PHP-Requests an den moodle-Container weiter
# - moodle: PHP 8.3 (FPM) mit Moodle aus dem Git-Repository
# - moodle-cron: Cron-Service für automatische Moodle-Tasks (gleiches Image)
# - postgres: PostgreSQL 17 Datenbank
# - pgadmin: Web-Interface für Datenbankmanagement
#
# Moodle-Version wählen (Branch, Tag oder Commit):
#   MOODLE_REF=MOODLE_405_STABLE docker compose build
#
# ==============================================================================

# Gemeinsame Einstellungen für PHP-FPM- und Cron-Container
x-moodle: &moodle
  # Multi-Stage-Build: base (PHP-FPM ohne Build-Artefakte) -> moodle (Code aus Git)
  build:
    context: .
    target: moodle
    args:
      MOODLE_REF: ${MOODLE_REF:-MOODLE_503_STABLE}
  image: moodle-dev:${MOODLE_REF:-MOODLE_503_STABLE}

  # Container automatisch neu starten bei Fehlern oder System-Neustart
  restart: always

  # Wird von Docker/config.php ausgewertet
  environment:
    MOODLE_WWWROOT: ${MOODLE_WWWROOT:-http://localhost}
    MOODLE_DB_TYPE: pgsql
    MOODLE_DB_HOST: postgres
    MOODLE_DB_NAME: moodle
    MOODLE_DB_USER: postgres
    MOODLE_DB_PASSWORD: mypwd
    MOODLE_DEBUG: "1"

  volumes:
    # Moodle-Datenverzeichnis (Uploads, Cache, etc.)
    - ./moodledata:/var/www/moodledata
    # Der Moodle-Code liegt im Image. Für die Plugin-Entwicklung einzelne
    # Plugin-Verzeichnisse einhängen, z.B. (ab Moodle 5.1 unter public/).
    # Denselben Mount auch beim web-Service eintragen (statische Dateien).
    # - ./plugins/local_myplugin:/var/www/html/public/local/myplugin

  depends_on:
    postgres:
      condition: service_healthy

services:

  # =============================================================================
  # NGINX WEB-SERVICE
  # =============================================================================
  # Liefert statische Dateien aus und reicht PHP an moodle:9000 (PHP-FPM) weiter
  web:
    build:
      context: .
      target: web
      args:
        MOODLE_REF: ${MOODLE_REF:-MOODLE_503_STABLE}
    image: moodle-web:${MOODLE_REF:-MOODLE_503_STABLE}

    # Port-Mapping: Host:Container
    # Moodle ist über http://<ip> erreichbar
    ports:
      - 80:80

    restart: always

    environment:
      PHP_FPM_HOST: moodle:9000

    # volumes:
    #   - ./plugins/local_myplugin:/var/www/html/public/local/myplugin

    depends_on:
      - moodle

  # =============================================================================
  # MOODLE PHP-FPM-SERVICE
  # =============================================================================
  moodle:
    <<: *moodle

  # =============================================================================
  # MOODLE CRON-SERVICE
  # =============================================================================
  # Nutzt dasselbe Image wie der moodle-Container und führt den Moodle-Cron
  # jede Minute als www-data aus (keine root-eigenen Dateien in moodledata).
  moodle-cron:
    <<: *moodle
    user: www-data
    command: ["sh", "-c", "while true; do php /var/www/html/admin/cli/cron.php; sleep 60; done"]

  # =============================================================================
  # POSTGRESQL DATENBANK
  # =============================================================================
  # PostgreSQL 17 als primäre Datenbank für Moodle (Mindestversion für Moodle 5.3)
  postgres:
    image: "postgres:17"

    # Port-Mapping für direkten Datenbankzugriff
    # Erreichbar über localhost:5432
    ports:
      - "5432:5432"

    # Container automatisch neu starten
    restart: always

    # Umgebungsvariablen für Datenbank-Konfiguration
    environment:
      # Passwort für den postgres-Superuser
      POSTGRES_PASSWORD: mypwd
      # Standard-Datenbank für Moodle
      POSTGRES_DB: moodle
      # Automatisch erstellter Benutzer (gleich wie DB-Name)
      POSTGRES_USER: postgres

    # Persistent Volume für Datenbankdaten
    volumes:
      # Lokales Verzeichnis für Datenpersistierung
      - ./pgdata:/var/lib/postgresql/data

    # Gesundheitsprüfung für bessere Abhängigkeitsverwaltung
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # PGADMIN WEB-INTERFACE
  # =============================================================================
  # Web-basierte Datenbankverwaltung für PostgreSQL
  pgadmin:
    # Offizielles pgAdmin 4 Image
    image: dpage/pgadmin4

    # Container automatisch neu starten
    restart: always

    # Umgebungsvariablen für pgAdmin-Konfiguration
    environment:
      # Standard-Login-Email für pgAdmin
      PGADMIN_DEFAULT_EMAIL: xxx@xxx.xxx
      # Standard-Passwort für pgAdmin
      PGADMIN_DEFAULT_PASSWORD: verysecure
      # Deaktiviert die Anforderung für HTTPS (nur für Entwicklung!)
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: 'True'
      PGADMIN_CONFIG_LOGIN_BANNER: '"Moodle Development Database"'

    # Lokales Verzeichnis für pgAdmin-Daten (Persistenz)
    volumes:
      - ./pgadmin:/var/lib/pgadmin
    # Port-Mapping für Web-Interface
    # pgAdmin erreichbar über http://<ip>:8080
    ports:
      - "8080:80"

    # Abhängigkeiten - startet nach der Datenbank
    depends_on:
      - postgres
